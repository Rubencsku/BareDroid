[core]
backend=drm-backend.so
shell=desktop-shell.so
idle-time=60
require-input=false
xwayland=true

[shell]
locking=false
animation=fade
panel-position=top
clock-format=24h
background-color=0xff1e293b
close-animation=fade

[output]
name=DSI-1
mode=1080x2400
scale=2
transform=normal

[output]
name=Virtual-1
mode=off

[keyboard]
keymap_layout=es

[terminal]
font=monospace
font-size=14

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/org.xfce.terminal.png
path=/usr/bin/xfce4-terminal

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/org.xfce.thunar.png
path=/usr/bin/thunar

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/org.xfce.appfinder.png
path=/usr/bin/xfce4-appfinder

[autolaunch]
path=/usr/bin/xfce4-terminal
